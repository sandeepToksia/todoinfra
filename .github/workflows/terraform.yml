name: Terraform Deployment Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # -----------------------
  # 1. INIT STAGE
  # -----------------------
  init:
    name: Terraform Init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envirment/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init


  # -----------------------
  # 2. SECURITY SCAN STAGE
  # -----------------------
  scan:
    name: tfsec Security Scan
    runs-on: ubuntu-latest
    needs: init
    defaults:
      run:
        working-directory: envirment/dev

    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec Scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: envirment/dev


  # -----------------------
  # 3. VALIDATE STAGE
  # -----------------------
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: scan
    defaults:
      run:
        working-directory: envirment/dev

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate


  # -----------------------
  # 4. PLAN STAGE
  # -----------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: envirment/dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: envirment/dev/tfplan


  # -----------------------
  # 5. MANUAL APPROVAL GATE
  # -----------------------
  approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: plan
    environment:
      name: dev-approval
    steps:
      - name: Approval Step
        run: echo "Waiting for manual approval before apply..."


  # -----------------------
  # 6. APPLY STAGE
  # -----------------------
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: approval
    defaults:
      run:
        working-directory: envirment/dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: envirment/dev

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
